name: iMessage dataset intake

on:
  schedule:
    - cron: '23 16 * * 1'
  workflow_dispatch: {}
  push:
    branches:
      - codex-video-v3/dataset

permissions:
  contents: read

jobs:
  intake-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: |
            datasets/imessage
            review/imv-v3/dataset
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install media tooling
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          python3 -m pip install -r datasets/imessage/requirements.txt
      - name: Run the dataset intake proof
        run: python3 datasets/imessage/prove.py
