<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frame comparison</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #13151a; color: #f3f4f6; }
  body { margin: 1.25rem auto; padding: 0 1rem; max-width: 92rem; }
  h1 { font-size: 1.45rem; margin: 0 0 1rem; }
  p { color: #c7ccd5; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: .65rem; }
  button, input { font: inherit; }
  button { padding: .35rem .7rem; }
  input[type=number] { width: 5rem; }
  input[type=range] { flex: 1 1 12rem; min-width: 6rem; }
  .labels { display: grid; grid-template-columns: 1fr 1fr; margin: .75em 0 .4em; font-weight: 600; }
  img { display: block; width: 100%; max-height: 72vh; object-fit: contain; background: #252830; }
  a { color: #a5d1ff; }
</style>
<main>
  <h1>Frame comparison</h1>
  <div class="controls">
    <button id="prev" type="button">Previous</button>
    <label for="number">Frame</label>
    <input id="number" type="number" min="0" step="1" value="0">
    <button id="next" type="button">Next</button>
    <input id="position" type="range" min="0" step="1" value="0" aria-label="Frame position">
  </div>
  <p id="metrics" aria-live="polite"></p>
  <div class="labels"><span>Original</span><span>Render</span></div>
  <img id="pair" alt="Original and render on the same frame">
  <p>Use the left and right arrow keys to step. <a href="frames.csv">Native pixel metrics</a> · <a href="report.json">Report</a></p>
</main>
<script src="frame-data.js"></script>
<script>
  const number = document.querySelector('#number');
  const position = document.querySelector('#position');
  const pair = document.querySelector('#pair');
  const metrics = document.querySelector('#metrics');
  const prev = document.querySelector('#prev');
  const next = document.querySelector('#next');
  const last = frameData.length - 1;
  number.max = position.max = last;
  let frame = 0;
  function show(value) {
    if (!Number.isFinite(value)) return;
    frame = Math.max(0, Math.min(last, Math.floor(value)));
    number.value = position.value = frame;
    prev.disabled = frame === 0;
    next.disabled = frame === last;
    const { seconds, mae, exact } = frameData[frame];
    const [numerator, denominator = '1'] = seconds.split('/');
    const displayTime = (Number(numerator) / Number(denominator)).toFixed(3);
    metrics.textContent = `Frame ${frame} of ${last} · ${displayTime} s · RGB error ${mae.toFixed(3)}${exact ? ' · exact decoded RGB match' : ''}`;
    pair.src = `pairs/${String(frame).padStart(6, '0')}.jpg`;
  }
  number.addEventListener('change', () => show(number.valueAsNumber));
  position.addEventListener('input', () => show(position.valueAsNumber));
  prev.addEventListener('click', () => show(frame - 1));
  next.addEventListener('click', () => show(frame + 1));
  document.addEventListener('keydown', event => {
    if (event.target.tagName === 'INPUT' || !['ArrowLeft', 'ArrowRight'].includes(event.key)) return;
    event.preventDefault();
    show(frame + (event.key === 'ArrowLeft' ? -1 : 1));
  });
  show(Number(new URLSearchParams(location.search).get('frame')));
</script>
</html>
